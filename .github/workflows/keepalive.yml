name: Keepalive ping

on:
  schedule:
    - cron: '0 8 */2 * *'  # every 2 days at 08:00 UTC
  workflow_dispatch:        # allow manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping keepalive endpoint
        run: |
          SITE_URL=$(printf '%s' "${{ vars.SITE_URL }}" | xargs)
          SITE_URL="${SITE_URL%/}"
          echo "Pinging: ${SITE_URL}/api/keepalive"
          STATUS=$(curl -s -L -o /dev/null -w "%{http_code}" "${SITE_URL}/api/keepalive")
          echo "Response status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "Keepalive ping failed with status $STATUS"
            exit 1
          fi
